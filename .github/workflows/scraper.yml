name: Update AIbase RSS Feed
on:
  schedule:
    - cron: '00 1  * * *'   # UTC 01:00 = 北京时间 09:00，作为补跑保底
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scraper.py'        # 只有改了这两个文件才触发
      - 'requirements.txt'  # docs/feed.xml 的提交不会再触发新的运行

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run scraper
        run: python scraper.py
      - name: Commit and push feed.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml
          git diff --staged --quiet || git commit -m "chore: update RSS feed $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
